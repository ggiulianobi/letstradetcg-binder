<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus binders — LetsTradeTCG</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/holo.css">
</head>
<body>

<div class="navbar">
  <a class="brand display" href="index.html">LetsTradeTCG Binder</a>
  <div class="user">
    <span id="userName">…</span>
    <button id="logoutBtn">Sair</button>
  </div>
</div>

<div class="dash">
  <aside class="dash-sidebar">
    <button class="add-binder-btn" id="addBinderBtn">
      <span class="plus">+</span> Add new Binder
    </button>
    <div class="binder-list" id="binderList"></div>
  </aside>

  <main class="dash-main">
    <div id="emptyState" style="text-align:center; padding:60px 20px; color:var(--ink-dim);">
      <p>Você ainda não tem nenhum binder.<br>Clique em <b>Add new Binder</b> pra criar o primeiro.</p>
    </div>

    <div id="binderView" style="display:none;">
      <div class="binder-heading">
        <h2 class="display" id="binderName"></h2>
        <div class="share">
          Link público: <code id="shareLink"></code>
          <button class="btn secondary small" id="copyBtn" style="margin-left:8px;">Copiar</button>
          <button class="btn secondary small" id="deleteBinderBtn" style="margin-left:4px;">Apagar binder</button>
        </div>
        <div class="visibility-row">
          <label class="toggle-switch">
            <input type="checkbox" id="publicToggle">
            <span class="toggle-slider"></span>
          </label>
          <span id="publicToggleLabel">Pesquisável: não</span>
        </div>
      </div>

      <button class="upload-trigger" id="uploadTrigger">
        <span class="plus">+</span>
        <strong>Adicionar cartas</strong>
        <span style="font-size:12px;">Arraste aqui ou toque pra escolher — JPG, PNG, AVIF, HEIC</span>
      </button>
      <input type="file" id="fileInput" accept="image/*,.heic,.heif,.avif" multiple style="display:none;">

      <div class="msg" id="uploadMsg"></div>
      <div class="pending-list" id="pendingList"></div>

      <div class="grid" id="grid"></div>
    </div>
  </main>
</div>

<!-- Modal: novo binder -->
<div class="modal-overlay" id="binderModal">
  <div class="modal">
    <h3 class="display">Add new Binder</h3>
    <div class="field">
      <label>Nome da pasta</label>
      <input type="text" id="newBinderName" maxlength="60" placeholder="ex: Cartas pra troca">
    </div>
    <button class="btn" id="createBinderBtn">Criar binder</button>
    <button class="btn secondary" id="cancelBinderBtn" style="margin-top:8px;">Cancelar</button>
  </div>
</div>

<!-- Modal: editar carta -->
<div class="modal-overlay" id="editCardModal">
  <div class="modal wide">
    <h3 class="display">Editar carta</h3>
    <img id="editCardImg" src="" alt="" style="width:120px; display:block; margin:0 auto 16px; border-radius:10px;">
    <div class="items-list" id="editItemsList"></div>
    <button type="button" class="add-line-btn" id="addEditLineBtn">+ Adicionar linha (outra carta nessa foto)</button>
    <div class="msg" id="editMsg"></div>
    <button class="btn" id="saveEditBtn">Salvar alterações</button>
    <button class="btn secondary" id="cancelEditBtn" style="margin-top:8px;">Cancelar</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">✕</button>
  <img id="lbImg" src="" alt="">
  <div class="lightbox-info" id="lbInfo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/image-utils.js"></script>
<script>
  let user = null, profile = null, binders = [], activeBinder = null;

  async function boot(){
    const { data:{ session } } = await supabaseClient.auth.getSession();
    if(!session){ window.location.href = "index.html"; return; }
    user = session.user;

    const { data } = await supabaseClient.from("profiles").select("*").eq("id", user.id).single();
    profile = data;
    document.getElementById("userName").textContent = profile?.nickname || user.email;

    loadBinders();
  }

  document.getElementById("logoutBtn").onclick = async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  };

  // ---------- Binders ----------
  async function loadBinders(){
    const { data } = await supabaseClient
      .from("binders").select("*").eq("user_id", user.id)
      .order("created_at", { ascending:true });
    binders = data || [];

    const list = document.getElementById("binderList");
    list.innerHTML = binders.map(b =>
      `<button data-id="${b.id}" class="${activeBinder?.id === b.id ? "active" : ""}">${b.name}</button>`
    ).join("");
    list.querySelectorAll("button").forEach(btn => {
      btn.onclick = () => selectBinder(btn.dataset.id);
    });

    if(!binders.length){
      document.getElementById("emptyState").style.display = "block";
      document.getElementById("binderView").style.display = "none";
    } else {
      selectBinder(activeBinder?.id && binders.find(b=>b.id===activeBinder.id) ? activeBinder.id : binders[0].id);
    }
  }

  function selectBinder(id){
    activeBinder = binders.find(b => b.id === id);
    if(!activeBinder) return;

    document.getElementById("emptyState").style.display = "none";
    document.getElementById("binderView").style.display = "block";
    document.getElementById("binderName").textContent = activeBinder.name;

    const url = `${location.origin}${location.pathname.replace("dashboard.html","")}binder.html?b=${activeBinder.id}`;
    document.getElementById("shareLink").textContent = url;

    document.getElementById("publicToggle").checked = !!activeBinder.is_public;
    document.getElementById("publicToggleLabel").textContent =
      activeBinder.is_public ? "Pesquisável: sim" : "Pesquisável: não";

    document.querySelectorAll("#binderList button").forEach(btn =>
      btn.classList.toggle("active", btn.dataset.id === id)
    );

    document.getElementById("pendingList").innerHTML = "";
    loadCards();
  }

  const modal = document.getElementById("binderModal");
  document.getElementById("addBinderBtn").onclick = () => modal.classList.add("open");
  document.getElementById("cancelBinderBtn").onclick = () => modal.classList.remove("open");

  document.getElementById("createBinderBtn").onclick = async () => {
    const name = document.getElementById("newBinderName").value.trim();
    if(!name) return alert("Dê um nome pra pasta.");
    const { data, error } = await supabaseClient
      .from("binders").insert({ user_id:user.id, name }).select().single();
    if(error) return alert("Erro: " + error.message);
    modal.classList.remove("open");
    document.getElementById("newBinderName").value = "";
    activeBinder = data;
    loadBinders();
  };

  document.getElementById("deleteBinderBtn").onclick = async () => {
    if(!confirm(`Apagar o binder "${activeBinder.name}" e todas as cartas dele?`)) return;
    const { data: cards } = await supabaseClient
      .from("cards").select("image_path").eq("binder_id", activeBinder.id);
    if(cards?.length){
      await supabaseClient.storage.from(BUCKET).remove(cards.map(c => c.image_path));
    }
    await supabaseClient.from("binders").delete().eq("id", activeBinder.id);
    activeBinder = null;
    loadBinders();
  };

  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(document.getElementById("shareLink").textContent);
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copiado!";
    setTimeout(() => btn.textContent = "Copiar", 1500);
  };

  document.getElementById("publicToggle").onchange = async (e) => {
    const isPublic = e.target.checked;
    const { error } = await supabaseClient
      .from("binders").update({ is_public: isPublic }).eq("id", activeBinder.id);
    if(error){
      alert("Erro: " + error.message);
      e.target.checked = !isPublic;
      return;
    }
    activeBinder.is_public = isPublic;
    const b = binders.find(x => x.id === activeBinder.id);
    if(b) b.is_public = isPublic;
    document.getElementById("publicToggleLabel").textContent =
      isPublic ? "Pesquisável: sim" : "Pesquisável: não";
  };

  // ---------- Upload → formulário "Criar folha" ----------
  const trigger = document.getElementById("uploadTrigger");
  const fileInput = document.getElementById("fileInput");
  const pendingList = document.getElementById("pendingList");
  const uploadMsg = document.getElementById("uploadMsg");

  trigger.onclick = () => fileInput.click();
  trigger.addEventListener("dragover", e => { e.preventDefault(); trigger.classList.add("drag"); });
  trigger.addEventListener("dragleave", () => trigger.classList.remove("drag"));
  trigger.addEventListener("drop", e => {
    e.preventDefault(); trigger.classList.remove("drag");
    queueFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener("change", () => { queueFiles(fileInput.files); fileInput.value = ""; });

  async function queueFiles(fileList){
    const files = Array.from(fileList);
    if(!files.length) return;

    uploadMsg.className = "msg show ok";
    uploadMsg.textContent = `Preparando ${files.length} imagem(ns)…`;

    for(const file of files){
      try{
        const blob = await processImage(file);
        addPendingCard(blob);
      }catch(err){
        uploadMsg.className = "msg show error";
        uploadMsg.textContent = err.message || `Erro ao processar ${file.name}`;
      }
    }
    uploadMsg.className = "msg";
  }

  // ---------- Linhas de classificação (uma foto pode ter várias cartas) ----------
  function itemLineHTML(data){
    data = data || {};
    const esc = s => (s || "").replace(/"/g, "&quot;");
    return `
      <div class="item-line">
        <button type="button" class="remove-line-btn" title="Remover linha">✕</button>
        <div class="field">
          <label>Estado da carta</label>
          <select class="cond-select">
            ${CONDITIONS.map(c => `<option value="${c}" ${data.condition===c?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Preço (BRL)</label>
          <input type="text" class="price-input" placeholder="ex: 25,00" value="${esc(data.price)}">
        </div>
        <div class="checkbox-row">
          <label><input type="checkbox" class="trade-check" ${data.for_trade?"checked":""}> Troca</label>
          <label><input type="checkbox" class="sale-check" ${data.for_sale?"checked":""}> Venda</label>
        </div>
        <div class="field note-field">
          <label>Observação (opcional — ex: "carta da esquerda")</label>
          <input type="text" class="note-input" maxlength="120" placeholder="pra indicar qual carta da foto" value="${esc(data.note)}">
        </div>
      </div>
    `;
  }

  function setupLinesContainer(containerEl, addBtnEl){
    function refreshRemoveButtons(){
      const lines = containerEl.querySelectorAll(".item-line");
      lines.forEach(line => {
        const btn = line.querySelector(".remove-line-btn");
        btn.style.visibility = lines.length > 1 ? "visible" : "hidden";
        btn.onclick = () => {
          if(containerEl.querySelectorAll(".item-line").length <= 1) return;
          line.remove();
          refreshRemoveButtons();
        };
      });
    }
    addBtnEl.onclick = () => {
      containerEl.insertAdjacentHTML("beforeend", itemLineHTML());
      refreshRemoveButtons();
    };
    refreshRemoveButtons();
  }

  function readLines(containerEl){
    return Array.from(containerEl.querySelectorAll(".item-line")).map(line => ({
      condition: line.querySelector(".cond-select").value,
      price: line.querySelector(".price-input").value.trim(),
      for_trade: line.querySelector(".trade-check").checked,
      for_sale: line.querySelector(".sale-check").checked,
      note: line.querySelector(".note-input").value.trim()
    }));
  }

  function renderLightboxInfo(items){
    if(!items.length){
      return `<p style="color:var(--ink-dim); font-size:13px;">Sem informações cadastradas.</p>`;
    }
    return items.map(it => {
      const flags = [it.for_trade && "Troca", it.for_sale && "Venda"].filter(Boolean);
      return `
        <div class="li-item">
          <div class="li-top">
            <span class="li-cond">${it.condition || "—"}</span>
            <span class="li-price">${it.price ? "R$ " + it.price : "Consulte"}</span>
          </div>
          <div class="li-flags">${flags.map(f => `<span>${f}</span>`).join("")}</div>
          ${it.note ? `<div class="li-note">"${it.note}"</div>` : ""}
        </div>`;
    }).join("");
  }

  // ---------- Upload de foto ----------
  function addPendingCard(blob){
    const previewUrl = URL.createObjectURL(blob);
    const el = document.createElement("div");
    el.className = "pending-card";
    el.innerHTML = `
      <img src="${previewUrl}" alt="pré-visualização">
      <div class="lines-col">
        <div class="items-list">${itemLineHTML()}</div>
        <button type="button" class="add-line-btn">+ Adicionar linha (outra carta nessa foto)</button>
        <div class="form-actions">
          <button class="btn small create-btn">Criar folha</button>
        </div>
      </div>
    `;

    const itemsList = el.querySelector(".items-list");
    setupLinesContainer(itemsList, el.querySelector(".add-line-btn"));

    el.querySelector(".create-btn").onclick = async (ev) => {
      const btn = ev.target;
      btn.disabled = true;
      btn.textContent = "Enviando…";

      const path = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const { error: upErr } = await supabaseClient.storage
        .from(BUCKET).upload(path, blob, { contentType:"image/jpeg", cacheControl:"3600" });

      if(upErr){
        alert("Erro ao subir imagem: " + upErr.message);
        btn.disabled = false; btn.textContent = "Criar folha";
        return;
      }

      const { data: cardRow, error: dbErr } = await supabaseClient.from("cards").insert({
        binder_id: activeBinder.id,
        user_id: user.id,
        image_path: path
      }).select().single();

      if(dbErr){
        alert("Erro ao salvar carta: " + dbErr.message);
        btn.disabled = false; btn.textContent = "Criar folha";
        return;
      }

      const lines = readLines(itemsList).map(l => ({ ...l, card_id: cardRow.id, user_id: user.id }));
      const { error: itemsErr } = await supabaseClient.from("card_items").insert(lines);
      if(itemsErr){
        alert("Carta criada, mas houve erro ao salvar a classificação: " + itemsErr.message);
      }

      URL.revokeObjectURL(previewUrl);
      el.remove();
      loadCards();
    };

    pendingList.appendChild(el);
  }

  // ---------- Grid de cartas já salvas ----------
  const grid = document.getElementById("grid");
  let cardUrls = [];
  let cardsData = [];

  function tileHTML(i, url, items){
    const n = items.length;
    const condBadge = n <= 1 ? (items[0]?.condition || "—") : `${n}×`;
    const tagHTML = n <= 1
      ? (() => {
          const it = items[0] || {};
          const flags = [it.for_trade && "Troca", it.for_sale && "Venda"].filter(Boolean);
          return `
            <span class="flags">${flags.map(f => `<span>${f}</span>`).join("")}</span>
            <span class="price">${it.price ? "R$ " + it.price : "Consulte"}</span>
          `;
        })()
      : `<span class="price">${n} itens — toque para ver</span>`;

    return `
      <span class="num">#${String(i+1).padStart(2,"0")}</span>
      <span class="cond">${condBadge}</span>
      <img src="${url}" alt="Carta" loading="lazy">
      <div class="holo-sheen"></div>
      <button class="edit-btn" title="Editar">✎</button>
      <button class="del-btn" title="Apagar">✕</button>
      <div class="tag">${tagHTML}</div>
    `;
  }

  async function loadCards(){
    const { data: cards } = await supabaseClient
      .from("cards").select("*").eq("binder_id", activeBinder.id)
      .order("created_at", { ascending:true });

    grid.innerHTML = "";
    cardUrls = [];
    cardsData = [];

    if(!cards || !cards.length){
      grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--ink-dim);">Nenhuma carta nesse binder ainda.</p>`;
      return;
    }

    const { data: items } = await supabaseClient
      .from("card_items").select("*").in("card_id", cards.map(c => c.id))
      .order("created_at", { ascending:true });

    const itemsByCard = {};
    (items || []).forEach(it => { (itemsByCard[it.card_id] ||= []).push(it); });

    cards.forEach((c, i) => {
      const url = supabaseClient.storage.from(BUCKET).getPublicUrl(c.image_path).data.publicUrl;
      const cardItems = itemsByCard[c.id] || [];
      cardUrls.push(url);
      cardsData.push({ ...c, items: cardItems });

      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = tileHTML(i, url, cardItems);
      el.querySelector("img").onclick = () => openLB(i);
      el.querySelector(".edit-btn").onclick = (ev) => { ev.stopPropagation(); openEditModal(c); };
      el.querySelector(".del-btn").onclick = async (ev) => {
        ev.stopPropagation();
        if(!confirm("Apagar essa carta?")) return;
        await supabaseClient.storage.from(BUCKET).remove([c.image_path]);
        await supabaseClient.from("cards").delete().eq("id", c.id);
        loadCards();
      };
      grid.appendChild(el);
    });
  }

  // ---------- Lightbox ----------
  const lb = document.getElementById("lightbox");
  function openLB(i){
    const card = cardsData[i];
    document.getElementById("lbImg").src = cardUrls[i];
    document.getElementById("lbInfo").innerHTML =
      `<h4>${card.items.length} ${card.items.length === 1 ? "item" : "itens"}</h4>${renderLightboxInfo(card.items)}`;
    lb.classList.add("open");
  }
  document.getElementById("lbClose").onclick = () => lb.classList.remove("open");
  lb.addEventListener("click", e => { if(e.target === lb) lb.classList.remove("open"); });

  // ---------- Modal: editar carta ----------
  let editingCard = null;
  const editModal = document.getElementById("editCardModal");
  const editItemsList = document.getElementById("editItemsList");

  function openEditModal(card){
    editingCard = card;
    document.getElementById("editCardImg").src =
      supabaseClient.storage.from(BUCKET).getPublicUrl(card.image_path).data.publicUrl;
    const items = cardsData.find(c => c.id === card.id)?.items || [];
    editItemsList.innerHTML = items.length
      ? items.map(it => itemLineHTML(it)).join("")
      : itemLineHTML();
    setupLinesContainer(editItemsList, document.getElementById("addEditLineBtn"));
    document.getElementById("editMsg").className = "msg";
    editModal.classList.add("open");
  }

  document.getElementById("cancelEditBtn").onclick = () => editModal.classList.remove("open");

  document.getElementById("saveEditBtn").onclick = async () => {
    const btn = document.getElementById("saveEditBtn");
    const editMsg = document.getElementById("editMsg");
    const lines = readLines(editItemsList);

    if(!lines.length){
      editMsg.className = "msg show error";
      editMsg.textContent = "Adicione pelo menos uma linha.";
      return;
    }

    btn.disabled = true;
    // Simplifica: apaga as linhas antigas e recria com os novos valores
    await supabaseClient.from("card_items").delete().eq("card_id", editingCard.id);
    const { error } = await supabaseClient.from("card_items").insert(
      lines.map(l => ({ ...l, card_id: editingCard.id, user_id: user.id }))
    );
    btn.disabled = false;

    if(error){
      editMsg.className = "msg show error";
      editMsg.textContent = error.message;
      return;
    }

    editModal.classList.remove("open");
    loadCards();
  };

  boot();
</script>

</body>
</html>
